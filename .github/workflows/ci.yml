name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'
      - name: Verify code formatting (Spring Java Format)
        run: mvn -ntp io.spring.javaformat:spring-javaformat-maven-plugin:validate
      - name: Build with Maven
        run: mvn -ntp clean verify

  examples:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - name: Install library modules
        run: mvn -ntp clean install -DskipTests
      - name: Build and test examples
        run: mvn -ntp clean verify -f examples/pom.xml
